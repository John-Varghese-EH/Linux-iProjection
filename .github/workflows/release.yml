name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Install build tools and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 libadwaita-1-dev gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
                                dpkg-dev debhelper libglib2.0-dev-bin python3-pip python3-venv \
                                appstream-util desktop-file-utils fuse \
                                build-essential python3-all dh-python python3-wheel pybuild-plugin-pyproject
                                
    - name: Set up Python Virtual Environment
      run: |
        python3 -m venv .venv --system-site-packages
        .venv/bin/pip install --upgrade pip build setuptools wheel

    - name: Compile GResource
      run: |
        glib-compile-resources --sourcedir=data data/linux_iprojection.gresource.xml --target=data/linux_iprojection.gresource
        
    - name: Build Python packages (Wheel & Source)
      run: .venv/bin/python -m build
      
    - name: Build Debian Package (.deb)
      run: |
        make deb
        
    - name: Build Tarball (.tar.gz)
      run: |
        make dist-tar
        
    - name: Build Flatpak (.flatpak)
      run: |
        sudo apt-get install -y flatpak flatpak-builder
        flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo build-dir packaging/flatpak/dev.linux_iprojection.LinuxIProjection.yml
        flatpak build-bundle repo dist/linux-iprojection-linux.flatpak dev.linux_iprojection.LinuxIProjection
        
    - name: Generate Checksums
      run: |
        cd dist
        sha256sum * > SHA256SUMS.txt
        echo "=== Release Artifact Checksums ==="
        cat SHA256SUMS.txt

    - name: Create Advanced GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          dist/*.whl
          dist/*.tar.gz
          dist/*.deb
          dist/*.flatpak
          dist/SHA256SUMS.txt
        generate_release_notes: true
        name: "iProjection for Linux Release ${{ github.ref_name }}"
        body: |
          🚀 **New Release for iProjection (Linux)**
          # Linux-iProjection ${{ github.ref_name }}
          
          Excited to announce **${{ github.ref_name }}** of Linux-iProjection, a native Linux control & casting app for Epson projectors (ESC/VP.net + EShare). This release brings significant stability, performance upgrades, and quality-of-life improvements.
          
          ## 🚀 What's New in ${{ github.ref_name }}
          
          *(Auto-generated from merged pull requests and commits)*
          
          ---
          
          ### 📦 Assets Available
          - **.deb**: For Debian, Ubuntu, Linux Mint, Pop!_OS
          - **.flatpak**: Universal sandboxed Linux binary (Recommended)
          - **.tar.gz**: Source code & Arch/AUR PKGBUILD integration
          - **.whl**: Standard Python Wheel
          
          ---
          
          ## 📦 Installation Options
          
          ### 1.🛠️ Quick Install
          ```bash
          sudo dpkg -i linux-iprojection_*.deb
          sudo apt-get install -f
          ```
          
          ### 2. Arch Linux (AUR)
          If you are on Arch Linux, Manjaro, or EndeavourOS, CachyOS, you can install directly from the Arch User Repository.
          ```bash
          yay -S linux-iprojection
          # or
          paru -S linux-iprojection
          ```
          
          ### 3. Ubuntu / Debian / Linux Mint (PPA)
          For Debian-based distributions, add the official PPA repository.
          ```bash
          sudo add-apt-repository ppa:cyber-trinity/linux-iprojection
          sudo apt update
          sudo apt install linux-iprojection
          ```
          
          ### 4. Python Virtual Environment (Recommended for Developers)
          The easiest way to install across any distribution using PyPI.
          ```bash
          # Clone the repository
          git clone https://github.com/John-Varghese-EH/Linux-iProjection.git
          cd Linux-iProjection
          
          # Create a virtual environment with system packages (required for GTK)
          python3 -m venv .venv --system-site-packages
          source .venv/bin/activate
          
          # Install the application
          pip install -e .
          
          # Run the app
          linux-iprojection
          ```
          
          ### 5. Flatpak (Universal Linux via Flathub)
          To run in an isolated sandbox across Fedora, Ubuntu, Arch, or openSUSE, use Flatpak.
          ```bash
          # Add the flathub remote if you haven't already
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          
          # Install Linux-iProjection
          flatpak install flathub io.github.JohnVarghese.LinuxiProjection
          
          # Run it
          flatpak run io.github.JohnVarghese.LinuxiProjection
          ```
          
          ---
          
          *Built with ❤️ by John Varghese (J0X) | Fueled by ☕️ and rainy days.*
          
          **Full Changelog**: https://github.com/John-Varghese-EH/Linux-iProjection/compare/${{ github.event.before }}...${{ github.ref_name }}

    - name: Publish to Arch User Repository (AUR)
      continue-on-error: true
      if: env.AUR_SSH_PRIVATE_KEY != ''
      env:
        AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        TARBALL="dist/linux-iprojection-${VERSION}.tar.gz"
        if [ ! -f "$TARBALL" ]; then
          echo "Release tarball $TARBALL not found, skipping AUR publish."
          exit 0
        fi

        # Check if the secret is a private key
        if ! echo "$AUR_SSH_PRIVATE_KEY" | grep -q "PRIVATE KEY"; then
          echo "::warning::AUR_SSH_PRIVATE_KEY secret does not appear to contain an OpenSSH private key (e.g. -----BEGIN OPENSSH PRIVATE KEY-----)."
          echo "::warning::Ensure you added your private key (from ~/.ssh/id_ed25519) to GitHub Secrets, while your public key (ssh-ed25519 AAAAC...) is saved in your AUR account settings."
          exit 0
        fi

        SHA256=$(sha256sum "$TARBALL" | awk '{print $1}')
        echo "Updating AUR for version $VERSION with SHA256: $SHA256"

        # Setup SSH directory & key
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        echo "$AUR_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/aur_key
        chmod 600 ~/.ssh/aur_key

        # Populate known hosts
        ssh-keyscan -H -t ed25519,ecdsa,rsa aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null || true

        # Write SSH configuration for aur.archlinux.org
        cat << 'EOF' > ~/.ssh/config
        Host aur.archlinux.org
            HostName aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
        EOF
        chmod 600 ~/.ssh/config

        # Update local PKGBUILD & .SRCINFO
        sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
        sed -i "s/^_srcver=.*/_srcver=${VERSION}/" PKGBUILD
        sed -i "s/^sha256sums=.*/sha256sums=('${SHA256}')/" PKGBUILD

        sed -i "s/pkgver = .*/pkgver = ${VERSION}/" .SRCINFO
        sed -i "s/source = linux-iprojection-.*::/source = linux-iprojection-${VERSION}.tar.gz::/" .SRCINFO
        sed -i "s/download\/v[^\/]*\//download\/v${VERSION}\//" .SRCINFO
        sed -i "s/linux-iprojection-.*\.tar\.gz/linux-iprojection-${VERSION}.tar.gz/" .SRCINFO
        sed -i "s/sha256sums = .*/sha256sums = ${SHA256}/" .SRCINFO

        # Clone or initialize AUR repository
        rm -rf /tmp/aur
        if git clone ssh://aur@aur.archlinux.org/linux-iprojection.git /tmp/aur; then
          echo "Successfully cloned AUR package repository."
        else
          echo "Repository clone returned code; initializing repo /tmp/aur..."
          mkdir -p /tmp/aur
          cd /tmp/aur
          git init
          git remote add origin ssh://aur@aur.archlinux.org/linux-iprojection.git
          cd -
        fi

        # Copy updated PKGBUILD and .SRCINFO
        cp PKGBUILD /tmp/aur/
        cp .SRCINFO /tmp/aur/

        cd /tmp/aur
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add PKGBUILD .SRCINFO
        git commit -m "Update to ${GITHUB_REF_NAME}" || echo "No changes to commit"
        git branch -M master
        git push origin master || echo "::warning::AUR push failed; check AUR account and SSH key permissions."
